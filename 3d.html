<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マイクラ風 3Dボクセル探索＆採掘プロトタイプ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #78a7ff;
            font-family: 'Inter', sans-serif;
        }
        .pixel-font {
            font-family: 'DotGothic16', monospace;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        /* ホットバースロットのマイクラ風ベベル枠 */
        .mc-slot {
            background: rgba(30, 34, 42, 0.78);
            border: 3px solid #373b44;
            box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.55), inset -2px -2px 0px rgba(255, 255, 255, 0.15);
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.12s ease;
        }
        .mc-slot.active {
            border-color: #facc15;
            background: rgba(55, 65, 81, 0.92);
            transform: translateY(-4px) scale(1.07);
            box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 0 0 1px #fef08a;
        }
        .mc-slot.pop {
            animation: slotPop 0.26s ease-out;
        }
        @keyframes slotPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        /* トースト通知アニメーション */
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(10px) scale(0.95); }
            15% { opacity: 1; transform: translateY(0) scale(1); }
            85% { opacity: 1; transform: translateY(-4px) scale(1); }
            100% { opacity: 0; transform: translateY(-14px) scale(0.95); }
        }
        .pickup-toast {
            animation: floatUpFade 1.5s ease-out forwards;
        }
        /* キャンバス描画のボケ防止 */
        canvas.pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="relative w-full h-full overflow-hidden">

    <!-- 3D描画キャンバス -->
    <canvas id="game-canvas"></canvas>

    <!-- 中央クロスヘア & 採掘リングゲージ -->
    <div id="crosshair-container" class="pointer-events-none fixed inset-0 flex items-center justify-center z-20">
        <div class="relative flex items-center justify-center w-14 h-14">
            <!-- 円形プログレスバー -->
            <svg class="w-12 h-12 -rotate-90 transform" viewBox="0 0 44 44">
                <circle id="mining-ring-bg" cx="22" cy="22" r="17" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="4" class="hidden"></circle>
                <circle id="mining-ring-bar" cx="22" cy="22" r="17" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8" class="hidden transition-none"></circle>
            </svg>
            <!-- 十字クロスヘア -->
            <div class="absolute w-4 h-0.5 bg-white/90 shadow-[0_0_2px_#000]"></div>
            <div class="absolute h-4 w-0.5 bg-white/90 shadow-[0_0_2px_#000]"></div>
        </div>
    </div>

    <!-- ターゲット中のブロック情報ラベル（クロスヘア少し下） -->
    <div id="target-info" class="pointer-events-none fixed left-1/2 top-[55%] -translate-x-1/2 z-20 hidden">
        <div class="bg-slate-900/80 backdrop-blur-sm text-white px-3 py-1 rounded-full border border-white/15 text-xs flex items-center gap-2 shadow-lg">
            <span id="target-block-dot" class="w-2.5 h-2.5 rounded-sm inline-block"></span>
            <span id="target-block-name" class="pixel-font tracking-wide font-semibold">草ブロック</span>
            <span class="text-amber-300/90 text-[10px] font-mono" id="target-block-hint">[左長押し: 破壊]</span>
        </div>
    </div>

    <!-- 左上：操作ガイド & ステータスHUD -->
    <div class="fixed top-3 left-3 z-20 flex flex-col gap-2 max-w-xs sm:max-w-sm pointer-events-auto">
        <div class="bg-slate-900/75 backdrop-blur-md border border-white/15 rounded-xl p-3 text-white shadow-xl">
            <div class="flex items-center justify-between gap-3 mb-1.5">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <h1 class="pixel-font text-sm sm:text-base font-bold tracking-wider text-emerald-300">VOXEL CRAFT 3D</h1>
                </div>
                <span id="camera-mode-badge" class="text-[11px] font-semibold bg-indigo-500/80 border border-indigo-300/40 px-2 py-0.5 rounded-md">
                    三人称視点 (TPS)
                </span>
            </div>

            <!-- 座標 & ドロップ数ステータス -->
            <div class="grid grid-cols-2 gap-1.5 text-[11px] font-mono bg-black/35 rounded-lg px-2.5 py-1.5 mb-2 text-slate-200">
                <div>XYZ: <span id="hud-coords" class="text-amber-300">0, 0, 0</span></div>
                <div>落ちている素材: <span id="hud-drops" class="text-emerald-300">0</span>個</div>
            </div>

            <!-- 操作説明リスト -->
            <div id="controls-panel" class="text-xs space-y-1 text-slate-200 leading-relaxed">
                <div class="flex justify-between">
                    <span class="text-slate-400">移動 / ダッシュ:</span>
                    <span><kbd class="px-1.5 py-0.5 bg-slate-700 rounded text-[10px]">WASD</kbd> + <kbd class="px-1.5 py-0.5 bg-slate-700 rounded text-[10px]">Shift</kbd></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">ジャンプ:</span>
                    <span><kbd class="px-1.5 py-0.5 bg-slate-700 rounded text-[10px]">Space</kbd></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">視点操作:</span>
                    <span>画面クリックでマウス固定 / ドラッグ</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">ブロック破壊:</span>
                    <span class="text-amber-300 font-medium">左クリック長押し (または <kbd class="px-1 py-0.5 bg-slate-700 rounded text-[10px]">E</kbd>)</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">ブロック設置:</span>
                    <span class="text-sky-300 font-medium">右クリック (または <kbd class="px-1 py-0.5 bg-slate-700 rounded text-[10px]">R</kbd>)</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">視点切替 (TPS/FPS):</span>
                    <span><kbd class="px-1.5 py-0.5 bg-slate-700 rounded text-[10px]">V</kbd> キー</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 右上：クイック操作ボタン群 -->
    <div class="fixed top-3 right-3 z-20 flex flex-wrap gap-2 justify-end">
        <button id="btn-toggle-view" class="bg-slate-900/80 hover:bg-slate-800 active:scale-95 text-white border border-white/20 rounded-xl px-3 py-2 text-xs font-semibold shadow-lg backdrop-blur-md flex items-center gap-1.5 transition">
            <span>🎥 視点切替 (V)</span>
        </button>
        <button id="btn-toggle-sound" class="bg-slate-900/80 hover:bg-slate-800 active:scale-95 text-white border border-white/20 rounded-xl px-3 py-2 text-xs font-semibold shadow-lg backdrop-blur-md flex items-center gap-1.5 transition">
            <span id="sound-icon">🔊 SE: ON</span>
        </button>
        <button id="btn-regen-world" class="bg-emerald-700/85 hover:bg-emerald-600 active:scale-95 text-white border border-emerald-300/30 rounded-xl px-3 py-2 text-xs font-semibold shadow-lg backdrop-blur-md flex items-center gap-1.5 transition">
            <span>🌲 ワールド再生成</span>
        </button>
    </div>

    <!-- 素材回収ログトースト表示エリア -->
    <div id="pickup-log" class="pointer-events-none fixed bottom-28 right-4 z-20 flex flex-col-reverse items-end gap-1.5"></div>

    <!-- モバイル・タッチ用バーチャルパッド（小画面またはタッチ端末向け） -->
    <div id="touch-controls" class="fixed bottom-24 left-4 right-4 z-20 flex justify-between items-end pointer-events-none md:hidden">
        <!-- 十字キー -->
        <div class="grid grid-cols-3 gap-1.5 pointer-events-auto bg-slate-900/50 p-2 rounded-2xl backdrop-blur-sm border border-white/10">
            <div></div>
            <button data-touch-key="KeyW" class="w-11 h-11 bg-slate-800/90 active:bg-amber-500 text-white rounded-xl font-bold text-sm border border-white/20">▲</button>
            <div></div>
            <button data-touch-key="KeyA" class="w-11 h-11 bg-slate-800/90 active:bg-amber-500 text-white rounded-xl font-bold text-sm border border-white/20">◀</button>
            <button data-touch-key="KeyS" class="w-11 h-11 bg-slate-800/90 active:bg-amber-500 text-white rounded-xl font-bold text-sm border border-white/20">▼</button>
            <button data-touch-key="KeyD" class="w-11 h-11 bg-slate-800/90 active:bg-amber-500 text-white rounded-xl font-bold text-sm border border-white/20">▶</button>
        </div>

        <!-- アクションボタン -->
        <div class="flex flex-col gap-2 pointer-events-auto">
            <div class="flex gap-2">
                <button id="btn-touch-mine" class="px-4 py-3 bg-amber-500/90 active:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-lg border border-amber-200">
                    ⛏️ 壊す(長押し)
                </button>
                <button id="btn-touch-place" class="px-3.5 py-3 bg-sky-500/90 active:bg-sky-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-lg border border-sky-200">
                    🧱 置く
                </button>
            </div>
            <button data-touch-key="Space" class="w-full py-2.5 bg-slate-800/90 active:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-lg border border-white/20">
                ⬆ ジャンプ
            </button>
        </div>
    </div>

    <!-- 下部中央：マイクラ風ホットバー（インベントリ） -->
    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-1.5">
        <div id="selected-item-banner" class="pixel-font text-xs text-white bg-slate-900/80 px-3 py-0.5 rounded-full border border-white/15 shadow">
            選択中: <span id="selected-item-label" class="text-amber-300 font-bold">草ブロック</span>
        </div>
        <div id="hotbar-container" class="flex items-center gap-1.5 sm:gap-2 p-1.5 rounded-2xl bg-slate-950/80 backdrop-blur-md border border-white/15 shadow-2xl">
            <!-- JSでスロットを生成 -->
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. サウンドシンセサイザー (Web Audio API による効果音生成)
         * ============================================================================
         */
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 歩行時の足音
            playStep() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(110 + Math.random() * 35, now);
                osc.frequency.exponentialRampToValueAtTime(45, now + 0.055);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }

            // 採掘中のヒット音
            playMineHit(pitchOffset = 1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime((160 + Math.random() * 40) * pitchOffset, now);
                osc.frequency.exponentialRampToValueAtTime(75, now + 0.045);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }

            // ブロック破壊完了音
            playBreak() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                // ホワイトノイズバースト＋低音ポップ
                const bufferSize = this.ctx.sampleRate * 0.12;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(650, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            // ドロップ素材の回収音（マイクラ風のポップ音）
            playPickup() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const baseFreq = 520 + Math.random() * 140;
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.085);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.095);
            }

            // ブロック設置音
            playPlace() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.06);
                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            }
        }

        const sfx = new SoundEffects();

        /**
         * ============================================================================
         * 2. ブロック定義 & 16x16 ピクセルアートテクスチャ生成
         * ============================================================================
         */
        const BLOCK_TYPES = {
            GRASS: {
                id: 'grass',
                slotIndex: 0,
                name: '草ブロック',
                hardness: 0.45, // 秒
                color: '#5da632',
                particleColor: 0x5da632,
                dropType: 'GRASS'
            },
            DIRT: {
                id: 'dirt',
                slotIndex: 1,
                name: '土ブロック',
                hardness: 0.4,
                color: '#866043',
                particleColor: 0x866043,
                dropType: 'DIRT'
            },
            STONE: {
                id: 'stone',
                slotIndex: 2,
                name: '石ブロック',
                hardness: 1.0,
                color: '#7d7d7d',
                particleColor: 0x8a8a8a,
                dropType: 'STONE'
            },
            WOOD: {
                id: 'wood',
                slotIndex: 3,
                name: '原木 (木材)',
                hardness: 0.75,
                color: '#6b5130',
                particleColor: 0x7b5c36,
                dropType: 'WOOD'
            },
            LEAVES: {
                id: 'leaves',
                slotIndex: 4,
                name: '木の葉',
                hardness: 0.22,
                color: '#3a8c2f',
                particleColor: 0x3a8c2f,
                dropType: 'LEAVES'
            }
        };

        const HOTBAR_ORDER = ['GRASS', 'DIRT', 'STONE', 'WOOD', 'LEAVES'];

        // 16x16 ドット絵テクスチャ動的生成ヘルパー
        function createPixelCanvas(drawFn, width = 16, height = 16) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, width, height);
            return canvas;
        }

        function canvasToTexture(canvas) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.generateMipmaps = false;
            return tex;
        }

        // 乱数シード付きノイズドット描画
        function fillNoisePixels(ctx, w, h, baseHex, palette, density = 0.45) {
            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, w, h);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (Math.random() < density) {
                        ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
        }

        // 各ブロック用のマテリアルとUIアイコン用Canvasを生成
        const blockMaterials = {};
        const blockIconCanvases = {};

        function initBlockMaterials() {
            // 1. 草ブロック（上面・側面・底面）
            const grassTopCanvas = createPixelCanvas((ctx, w, h) => {
                fillNoisePixels(ctx, w, h, '#5da632', ['#4f9128', '#6ab83d', '#549c2c', '#74c247'], 0.55);
            });
            const dirtCanvas = createPixelCanvas((ctx, w, h) => {
                fillNoisePixels(ctx, w, h, '#866043', ['#735136', '#966c4b', '#65452d', '#7b583b'], 0.55);
            });
            const grassSideCanvas = createPixelCanvas((ctx, w, h) => {
                ctx.drawImage(dirtCanvas, 0, 0);
                // 上部に草の垂れ下がりを描く
                for (let x = 0; x < w; x++) {
                    const grassDepth = 2 + Math.floor(Math.random() * 3);
                    for (let y = 0; y < grassDepth; y++) {
                        ctx.fillStyle = y === 0 ? '#6ab83d' : (Math.random() > 0.4 ? '#5da632' : '#4f9128');
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            });

            // 2. 石ブロック
            const stoneCanvas = createPixelCanvas((ctx, w, h) => {
                fillNoisePixels(ctx, w, h, '#7d7d7d', ['#6e6e6e', '#8c8c8c', '#636363', '#969696'], 0.55);
            });

            // 3. 原木（側面・上面）
            const woodSideCanvas = createPixelCanvas((ctx, w, h) => {
                ctx.fillStyle = '#6b5130';
                ctx.fillRect(0, 0, w, h);
                for (let x = 0; x < w; x++) {
                    const stripeColor = (x % 3 === 0) ? '#574024' : (x % 2 === 0 ? '#785b37' : '#6b5130');
                    ctx.fillStyle = stripeColor;
                    ctx.fillRect(x, 0, 1, h);
                    for (let y = 0; y < h; y++) {
                        if (Math.random() < 0.25) {
                            ctx.fillStyle = '#4c371e';
                            ctx.fillRect(x, y, 1, 1);
                        }
                    }
                }
            });
            const woodTopCanvas = createPixelCanvas((ctx, w, h) => {
                ctx.fillStyle = '#b8945f';
                ctx.fillRect(0, 0, w, h);
                // 外枠（樹皮）
                ctx.strokeStyle = '#574024';
                ctx.lineWidth = 2;
                ctx.strokeRect(1, 1, w - 2, h - 2);
                // 年輪
                ctx.strokeStyle = '#9c7a49';
                ctx.lineWidth = 1;
                ctx.strokeRect(4, 4, w - 8, h - 8);
                ctx.fillStyle = '#87673b';
                ctx.fillRect(7, 7, 2, 2);
            });

            // 4. 木の葉
            const leavesCanvas = createPixelCanvas((ctx, w, h) => {
                fillNoisePixels(ctx, w, h, '#38852e', ['#2b6b22', '#479e3b', '#23591b', '#52b046'], 0.65);
            });

            // マテリアル割り当て
            const grassTopMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(grassTopCanvas) });
            const grassSideMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(grassSideCanvas) });
            const dirtMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(dirtCanvas) });
            const stoneMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(stoneCanvas) });
            const woodSideMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(woodSideCanvas) });
            const woodTopMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(woodTopCanvas) });
            const leavesMat = new THREE.MeshLambertMaterial({ map: canvasToTexture(leavesCanvas) });

            blockMaterials.GRASS = [grassSideMat, grassSideMat, grassTopMat, dirtMat, grassSideMat, grassSideMat];
            blockMaterials.DIRT = dirtMat;
            blockMaterials.STONE = stoneMat;
            blockMaterials.WOOD = [woodSideMat, woodSideMat, woodTopMat, woodTopMat, woodSideMat, woodSideMat];
            blockMaterials.LEAVES = leavesMat;

            // ホットバーUI用のサムネイルCanvasを保存
            blockIconCanvases.GRASS = grassSideCanvas;
            blockIconCanvases.DIRT = dirtCanvas;
            blockIconCanvases.STONE = stoneCanvas;
            blockIconCanvases.WOOD = woodSideCanvas;
            blockIconCanvases.LEAVES = leavesCanvas;
        }

        /**
         * ============================================================================
         * 3. 3Dシーン・カメラ・ライティング初期化
         * ============================================================================
         */
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });

        /**
         * ============================================================================
         * 5. ワールド管理・ブロック配置・破壊・ドロップアイテム・パーティクル
         * ============================================================================
         */
        const WORLD_RADIUS = 16; // -16 〜 +16 (33x33 グリッド)
        const worldBlocks = new Map(); // key: "x,y,z" -> { x, y, z, type, mesh }
        const blockMeshes = []; // Raycast対象配列
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);

        // 水面プレーン（低地に配置）
        const waterGeo = new THREE.PlaneGeometry((WORLD_RADIUS * 2 + 2), (WORLD_RADIUS * 2 + 2));
        const waterMat = new THREE.MeshLambertMaterial({
            color: 0x2563eb,
            transparent: true,
            opacity: 0.62
        });
        const waterMesh = new THREE.Mesh(waterGeo, waterMat);
        waterMesh.rotation.x = -Math.PI / 2;
        waterMesh.position.set(0, 1.38, 0);
        scene.add(waterMesh);

        function getBlockKey(x, y, z) {
            return `${x},${y},${z}`;
        }

        function getBlock(x, y, z) {
            return worldBlocks.get(getBlockKey(Math.floor(x), Math.floor(y), Math.floor(z)));
        }

        function addBlock(x, y, z, typeKey) {
            x = Math.floor(x);
            y = Math.floor(y);
            z = Math.floor(z);
            const key = getBlockKey(x, y, z);
            if (worldBlocks.has(key)) return null;

            const mesh = new THREE.Mesh(blockGeo, blockMaterials[typeKey]);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { x, y, z, typeKey };

            scene.add(mesh);
            blockMeshes.push(mesh);
            const record = { x, y, z, typeKey, mesh };
            worldBlocks.set(key, record);
            return record;
        }

        function removeBlock(x, y, z) {
            const key = getBlockKey(x, y, z);
            const record = worldBlocks.get(key);
            if (!record) return null;

            scene.remove(record.mesh);
            const idx = blockMeshes.indexOf(record.mesh);
            if (idx !== -1) blockMeshes.splice(idx, 1);
            worldBlocks.delete(key);
            return record;
        }

        // シンプルな2D疑似ノイズ関数（起伏生成用）
        let noiseSeed = Math.random() * 1000;
        function pseudoNoise2D(x, z) {
            const sx = x * 0.11 + noiseSeed;
            const sz = z * 0.11 + noiseSeed * 0.7;
            const n1 = Math.sin(sx) * Math.cos(sz);
            const n2 = Math.sin(sx * 2.1 + sz * 1.4) * 0.45;
            return (n1 + n2) * 0.5;
        }

        // 木を生成するヘルパー
        function createTree(tx, ty, tz) {
            const trunkHeight = 3 + (Math.abs(tx * 7 + tz * 13) % 2);
            for (let h = 0; h < trunkHeight; h++) {
                addBlock(tx, ty + h, tz, 'WOOD');
            }
            // 葉のキャノピー
            const leafBase = ty + trunkHeight - 1;
            for (let lx = -2; lx <= 2; lx++) {
                for (let lz = -2; lz <= 2; lz++) {
                    for (let ly = 0; ly <= 2; ly++) {
                        const dist = Math.abs(lx) + Math.abs(lz);
                        if (ly === 2 && dist > 1) continue;
                        if (ly < 2 && dist === 4 && Math.random() < 0.6) continue;
                        if (lx === 0 && lz === 0 && ly < 1) continue; // 幹の中心は除外
                        addBlock(tx + lx, leafBase + ly, tz + lz, 'LEAVES');
                    }
                }
            }
        }

        // ワールド全体を生成
        function generateWorld() {
            // 既存ブロック・ドロップをクリア
            for (const rec of worldBlocks.values()) {
                scene.remove(rec.mesh);
            }
            worldBlocks.clear();
            blockMeshes.length = 0;

            for (const drop of droppedItems) {
                scene.remove(drop.mesh);
            }
            droppedItems.length = 0;
            updateDropsCounter();

            noiseSeed = Math.random() * 1000;
            const treePositions = [];

            for (let x = -WORLD_RADIUS; x <= WORLD_RADIUS; x++) {
                for (let z = -WORLD_RADIUS; z <= WORLD_RADIUS; z++) {
                    const n = pseudoNoise2D(x, z);
                    const surfaceY = Math.max(1, Math.floor(2.6 + n * 3.2));

                    for (let y = 0; y <= surfaceY; y++) {
                        let typeKey = 'STONE';
                        if (y === surfaceY) {
                            typeKey = surfaceY <= 1 ? 'DIRT' : 'GRASS';
                        } else if (y >= surfaceY - 1) {
                            typeKey = 'DIRT';
                        }
                        addBlock(x, y, z, typeKey);
                    }

                    // 中心のスポーン地点以外で、草ブロックの上に木をランダム配置
                    const distFromCenter = Math.hypot(x, z);
                    if (surfaceY >= 2 && distFromCenter > 3.5 && Math.abs(x) < WORLD_RADIUS - 2 && Math.abs(z) < WORLD_RADIUS - 2) {
                        if (Math.random() < 0.048) {
                            // 他の木と近すぎないかチェック
                            const tooClose = treePositions.some(p => Math.hypot(p.x - x, p.z - z) < 4.2);
                            if (!tooClose) {
                                treePositions.push({ x, y: surfaceY + 1, z });
                            }
                        }
                    }
                }
            }

            // 木を配置
            for (const t of treePositions) {
                createTree(t.x, t.y, t.z);
            }

            // プレイヤーを中央上空にスポーン
            resetPlayerPosition();
        }

        /**

        const debrisParticles = [];

        /**

        const inventory = {

        function buildHotbarUI() {

        /**
         * ============================================================================
         * 8. プレイヤー物理・移動・カメラ制御・当たり判定 (仕様 4 & 5 準拠)
         * ============================================================================
         */
        const player = {
            pos: new THREE.Vector3(0.5, 10, 0.5),
            vel: new THREE.Vector3(0, 0, 0),
            width: 0.6,   // AABB幅
            height: 1.75, // AABB高さ
            onGround: false,
            yaw: 0,       // 水平視点角
            pitch: -0.25, // 垂直視点角
            charYaw: 0,   // キャラクターの体の向き
            walkTime: 0,
            stepTimer: 0,
            isTPS: true   // デフォルトはキャラクターが見える三人称視点
        };

        function resetPlayerPosition() {
            // 中央(0,0)の一番高いブロックの上を探す
            let topY = 12;
            while (topY > 0 && !getBlock(0, topY, 0)) {
                topY--;
            }
            player.pos.set(0.5, topY + 1.5, 0.5);
            player.vel.set(0, 0, 0);
        }

        // グリッドAABB衝突判定
        function checkAABBCollision(px, py, pz) {
            const halfW = player.width / 2;
            const minX = Math.floor(px - halfW);
            const maxX = Math.floor(px + halfW);
            const minY = Math.floor(py);
            const maxY = Math.floor(py + player.height - 0.01);
            const minZ = Math.floor(pz - halfW);
            const maxZ = Math.floor(pz + halfW);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (getBlock(x, y, z)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        /**
         * ============================================================================
         * 9. ターゲット選択枠・ヒビ割れ演出・レイキャスト採掘 (仕様 2-①,② 準拠)
         * ============================================================================
         */
        const raycaster = new THREE.Raycaster();
        const MAX_REACH = 5.5;

        // 選択中のブロックを示す黒いワイヤーフレーム枠
        const highlightGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.006, 1.006, 1.006));
        const highlightMat = new THREE.LineBasicMaterial({ color: 0x111827, linewidth: 2 });
        const highlightBox = new THREE.LineSegments(highlightGeo, highlightMat);
        highlightBox.visible = false;
        scene.add(highlightBox);

        // 採掘進行度に応じたブロック表面のヒビ割れオーバーレイ
        const crackCanvases = [];
        const crackMaterials = [];
        for (let stage = 0; stage < 5; stage++) {
            const c = createPixelCanvas((ctx, w, h) => {
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.78)';
                ctx.lineWidth = 1;
                const lines = (stage + 1) * 3;
                for (let i = 0; i < lines; i++) {
                    ctx.beginPath();
                    ctx.moveTo(8, 8);
                    ctx.lineTo(
                        Math.floor(Math.random() * 16),
                        Math.floor(Math.random() * 16)
                    );
                    ctx.stroke();
                }
            });
            crackMaterials.push(new THREE.MeshBasicMaterial({
                map: canvasToTexture(c),
                transparent: true,
                depthWrite: false
            }));
        }
        const crackOverlayMesh = new THREE.Mesh(new THREE.BoxGeometry(1.01, 1.01, 1.01), crackMaterials[0]);
        crackOverlayMesh.visible = false;
        scene.add(crackOverlayMesh);

        // 採掘状態管理
        let targetedHit = null;
        let isMiningHeld = false;
        let miningTargetKey = null;
        let miningElapsed = 0;
        let miningHitSoundTimer = 0;

        function updateRaycastTarget() {
            // カメラ位置から画面中央方向へレイを飛ばす
            // TPS時はカメラからプレイヤーまでの距離を加味してリーチを調整
            const camDist = player.isTPS ? camera.position.distanceTo(player.pos.clone().add(new THREE.Vector3(0, 1.35, 0))) : 0;
            raycaster.far = MAX_REACH + camDist;
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(blockMeshes, false);
            if (intersects.length > 0) {
                const hit = intersects[0];
                const { x, y, z, typeKey } = hit.object.userData;
                // プレイヤーの中心から距離がMAX_REACH以内か確認
                const distFromPlayer = Math.hypot(
                    (x + 0.5) - player.pos.x,
                    (y + 0.5) - (player.pos.y + 1.1),
                    (z + 0.5) - player.pos.z
                );

                if (distFromPlayer <= MAX_REACH) {
                    targetedHit = hit;
                    highlightBox.position.set(x + 0.5, y + 0.5, z + 0.5);
                    highlightBox.visible = true;

                    // UIラベル更新
                    const def = BLOCK_TYPES[typeKey];
                    document.getElementById('target-info').classList.remove('hidden');
                    document.getElementById('target-block-name').textContent = def.name;
                    document.getElementById('target-block-dot').style.backgroundColor = def.color;
                    return;
                }
            }

            targetedHit = null;
            highlightBox.visible = false;
            crackOverlayMesh.visible = false;
            document.getElementById('target-info').classList.add('hidden');
        }

        // 右クリック（または設置ボタン）で選択中のブロックを設置
        function placeSelectedBlock() {
            if (!targetedHit) return;
            const currentTypeKey = HOTBAR_ORDER[selectedSlotIndex];
            if ((inventory[currentTypeKey] || 0) <= 0) return;

            const { x, y, z } = targetedHit.object.userData;
            const normal = targetedHit.face.normal;
            const nx = x + Math.round(normal.x);
            const ny = y + Math.round(normal.y);
            const nz = z + Math.round(normal.z);

            // プレイヤー自身の体と重なる位置には置けないようにチェック
            const halfW = player.width / 2;
            const overlapX = (player.pos.x + halfW > nx) && (player.pos.x - halfW < nx + 1);
            const overlapY = (player.pos.y + player.height > ny) && (player.pos.y < ny + 1);
            const overlapZ = (player.pos.z + halfW > nz) && (player.pos.z - halfW < nz + 1);
            if (overlapX && overlapY && overlapZ) return;

            const placed = addBlock(nx, ny, nz, currentTypeKey);
            if (placed) {
                inventory[currentTypeKey]--;
                const countEl = document.getElementById(`hotbar-count-${selectedSlotIndex}`);
                if (countEl) countEl.textContent = inventory[currentTypeKey];
                updateSelectedBanner();
                sfx.playPlace();
            }
        }

        /**
         * ============================================================================
         * 10. 入力イベント（キーボード・マウスロック・ドラッグフォールバック・タッチ）
         * ============================================================================
         */
        const keys = {};
        let isDraggingLook = false;
        let lastPointerX = 0;
        let lastPointerY = 0;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyV') {
                toggleCameraView();
            } else if (e.code === 'KeyE') {
                isMiningHeld = true;
            } else if (e.code === 'KeyR') {
                placeSelectedBlock();
            } else if (e.code.startsWith('Digit')) {
                const num = parseInt(e.code.replace('Digit', ''), 10);
                if (num >= 1 && num <= HOTBAR_ORDER.length) {
                    selectHotbarSlot(num - 1);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'KeyE') {
                isMiningHeld = false;
            }
        });

        // マウスホイールでホットバー切り替え
        window.addEventListener('wheel', (e) => {
            if (e.deltaY > 0) selectHotbarSlot(selectedSlotIndex + 1);
            else if (e.deltaY < 0) selectHotbarSlot(selectedSlotIndex - 1);
        });

        // キャンバスクリック＆ドラッグ＆Pointer Lock処理
        canvas.addEventListener('mousedown', (e) => {
            sfx.init();
            // Pointer Lock が使えればロック要求（iframe制限下でもエラーにならないようtry-catch）
            if (document.pointerLockElement !== canvas && e.button === 0) {
                try {
                    canvas.requestPointerLock();
                } catch (_) {}
            }

            if (e.button === 0) {
                isMiningHeld = true;
                isDraggingLook = true;
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
            } else if (e.button === 2) {
                placeSelectedBlock();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isMiningHeld = false;
                isDraggingLook = false;
            }
        });

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('mousemove', (e) => {
            const sensitivity = 0.0032;
            if (document.pointerLockElement === canvas) {
                player.yaw -= e.movementX * sensitivity;
                player.pitch = Math.max(-1.42, Math.min(1.42, player.pitch - e.movementY * sensitivity));
            } else if (isDraggingLook) {
                const dx = e.clientX - lastPointerX;
                const dy = e.clientY - lastPointerY;
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
                player.yaw -= dx * sensitivity * 1.3;
                player.pitch = Math.max(-1.42, Math.min(1.42, player.pitch - dy * sensitivity * 1.3));
            }
        });

        // タッチ視点回転サポート
        let touchLookId = null;
        canvas.addEventListener('touchstart', (e) => {
            sfx.init();
            if (e.touches.length > 0) {
                const t = e.touches[0];
                touchLookId = t.identifier;
                lastPointerX = t.clientX;
                lastPointerY = t.clientY;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === touchLookId) {
                    const dx = t.clientX - lastPointerX;
                    const dy = t.clientY - lastPointerY;
                    lastPointerX = t.clientX;
                    lastPointerY = t.clientY;
                    player.yaw -= dx * 0.005;
                    player.pitch = Math.max(-1.42, Math.min(1.42, player.pitch - dy * 0.005));
                }
            }
        }, { passive: true });

        // モバイルタッチボタンのバインド
        document.querySelectorAll('[data-touch-key]').forEach((btn) => {
            const code = btn.getAttribute('data-touch-key');
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
            btn.addEventListener('mousedown', () => { keys[code] = true; });
            btn.addEventListener('mouseup', () => { keys[code] = false; });
        });

        const btnTouchMine = document.getElementById('btn-touch-mine');
        btnTouchMine.addEventListener('touchstart', (e) => { e.preventDefault(); isMiningHeld = true; });
        btnTouchMine.addEventListener('touchend', (e) => { e.preventDefault(); isMiningHeld = false; });

        const btnTouchPlace = document.getElementById('btn-touch-place');
        btnTouchPlace.addEventListener('touchstart', (e) => { e.preventDefault(); placeSelectedBlock(); });

        // 上部クイックボタンイベント
        function toggleCameraView() {
            player.isTPS = !player.isTPS;
            characterGroup.visible = player.isTPS;
            const badge = document.getElementById('camera-mode-badge');
            badge.textContent = player.isTPS ? '三人称視点 (TPS)' : '一人称視点 (FPS)';
        }

        document.getElementById('btn-toggle-view').addEventListener('click', toggleCameraView);
        document.getElementById('btn-toggle-sound').addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            document.getElementById('sound-icon').textContent = sfx.enabled ? '🔊 SE: ON' : '🔇 SE: OFF';
        });
        document.getElementById('btn-regen-world').addEventListener('click', () => {
            generateWorld();
        });

        /**
         * ============================================================================
         * 11. メインゲームループ（物理演算・アニメーション・採掘・ドロップ回収）
         * ============================================================================
         */
        let prevTime = performance.now();

        function updateGame(dt) {
            // --- 1. プレイヤーの移動と物理演算 ---
            const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

            const moveDir = new THREE.Vector3();
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

            const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
            const speed = isSprinting ? 6.6 : 4.3;

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();
                player.vel.x = moveDir.x * speed;
                player.vel.z = moveDir.z * speed;

                // 進行方向へキャラクターの体の向きを滑らかに補間
                const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                let diff = targetAngle - player.charYaw;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                player.charYaw += diff * Math.min(1, dt * 12);
            } else {
                player.vel.x = 0;
                player.vel.z = 0;
                // 採掘中はカメラの方向へ体を向ける
                if (isMiningHeld) {
                    const lookAngle = player.yaw + Math.PI;
                    let diff = lookAngle - player.charYaw;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    player.charYaw += diff * Math.min(1, dt * 14);
                }
            }

            // ジャンプ＆重力
            if (keys['Space'] && player.onGround) {
                player.vel.y = 8.4; // 1ブロック強の段差を軽快に登れる跳躍力
                player.onGround = false;
            }
            player.vel.y -= 23.0 * dt; // 重力加速度
            if (player.vel.y < -28) player.vel.y = -28;

            // X軸移動＆衝突判定
            const nextX = player.pos.x + player.vel.x * dt;
            if (!checkAABBCollision(nextX, player.pos.y, player.pos.z)) {
                player.pos.x = nextX;
            }

            // Z軸移動＆衝突判定
            const nextZ = player.pos.z + player.vel.z * dt;
            if (!checkAABBCollision(player.pos.x, player.pos.y, nextZ)) {
                player.pos.z = nextZ;
            }

            // Y軸移動＆接地判定
            const nextY = player.pos.y + player.vel.y * dt;
            if (!checkAABBCollision(player.pos.x, nextY, player.pos.z)) {
                player.pos.y = nextY;
                player.onGround = false;
            } else {
                if (player.vel.y < 0) {
                    player.pos.y = Math.floor(nextY) + 1.0001;
                    player.onGround = true;
                }
                player.vel.y = 0;
            }

            // 万が一ワールド外へ落下したら中央へリスポーン
            if (player.pos.y < -12) {
                resetPlayerPosition();
            }

            // --- 2. キャラクターの階層アニメーション更新 (仕様 2 準拠) ---
            characterGroup.position.copy(player.pos);
            characterGroup.rotation.y = player.charYaw;

            const horizSpeed = Math.hypot(player.vel.x, player.vel.z);
            const nowSec = performance.now() * 0.001;

            if (horizSpeed > 0.15) {
                // 歩行・ダッシュ時の手足逆位相スイング
                player.walkTime += dt * horizSpeed * 2.3;
                const swingAmp = Math.min(0.85, horizSpeed * 0.14);
                leftLegPivot.rotation.x = Math.sin(player.walkTime) * swingAmp;
                rightLegPivot.rotation.x = -Math.sin(player.walkTime) * swingAmp;
                leftArmPivot.rotation.x = -Math.sin(player.walkTime) * swingAmp;

                if (!isMiningHeld) {
                    rightArmPivot.rotation.x = Math.sin(player.walkTime) * swingAmp;
                }

                // 足音再生
                if (player.onGround) {
                    player.stepTimer += dt * horizSpeed;
                    if (player.stepTimer > 1.85) {
                        player.stepTimer = 0;
                        sfx.playStep();
                    }
                }
            } else {
                // 待機時（呼吸モーション）
                leftLegPivot.rotation.x *= 0.82;
                rightLegPivot.rotation.x *= 0.82;
                leftArmPivot.rotation.x = Math.sin(nowSec * 2.2) * 0.05;
                if (!isMiningHeld) {
                    rightArmPivot.rotation.x = -Math.sin(nowSec * 2.2) * 0.05;
                }
            }

            // 空中ジャンプ時のポーズ補正
            if (!player.onGround) {
                leftArmPivot.rotation.z = 0.18;
                rightArmPivot.rotation.z = -0.18;
            } else {
                leftArmPivot.rotation.z = 0.03;
                rightArmPivot.rotation.z = -0.03;
            }

            // 採掘中の右腕高速スイング
            if (isMiningHeld) {
                rightArmPivot.rotation.x = -0.9 + Math.sin(nowSec * 26) * 0.65;
            }

            // 頭部をカメラのピッチ・ヨーに追従させる
            headPivot.rotation.x = -player.pitch * 0.7;

            // --- 3. カメラ位置更新 (TPS / FPS) ---
            const eyePos = new THREE.Vector3(player.pos.x, player.pos.y + 1.45, player.pos.z);
            const lookDir = new THREE.Vector3(
                -Math.sin(player.yaw) * Math.cos(player.pitch),
                Math.sin(player.pitch),
                -Math.cos(player.yaw) * Math.cos(player.pitch)
            ).normalize();

            if (player.isTPS) {
                // 背後上空からの三人称視点（壁めり込み防止調整付き）
                const desiredDist = 3.8;
                const camOffset = lookDir.clone().multiplyScalar(-desiredDist);
                camOffset.y += 0.35;
                camera.position.copy(eyePos).add(camOffset);
                camera.lookAt(eyePos.clone().add(lookDir.clone().multiplyScalar(6)));
            } else {
                // 一人称視点
                camera.position.copy(eyePos);
                camera.lookAt(eyePos.clone().add(lookDir));
            }

            // --- 4. レイキャストとブロック破壊処理 ---
            updateRaycastTarget();

            const ringBg = document.getElementById('mining-ring-bg');
            const ringBar = document.getElementById('mining-ring-bar');
            const circumference = 106.8;

            if (isMiningHeld && targetedHit) {
                const { x, y, z, typeKey } = targetedHit.object.userData;
                const key = getBlockKey(x, y, z);
                const blockDef = BLOCK_TYPES[typeKey];

                if (miningTargetKey !== key) {
                    miningTargetKey = key;
                    miningElapsed = 0;
                }

                miningElapsed += dt;
                miningHitSoundTimer += dt;
                if (miningHitSoundTimer >= 0.18) {
                    miningHitSoundTimer = 0;
                    sfx.playMineHit(1 + (miningElapsed / blockDef.hardness) * 0.35);
                }

                const progress = Math.min(1, miningElapsed / blockDef.hardness);

                // 円形プログレスバー表示
                ringBg.classList.remove('hidden');
                ringBar.classList.remove('hidden');
                ringBar.style.strokeDashoffset = (circumference * (1 - progress)).toFixed(1);

                // ブロック表面のヒビ割れオーバーレイ表示
                const crackStage = Math.min(4, Math.floor(progress * 5));
                crackOverlayMesh.material = crackMaterials[crackStage];
                crackOverlayMesh.position.set(x + 0.5, y + 0.5, z + 0.5);
                crackOverlayMesh.visible = true;

                // 破壊完了！
                if (progress >= 1) {
                    removeBlock(x, y, z);
                    sfx.playBreak();
                    spawnBreakParticles(x, y, z, blockDef.particleColor);
                    spawnDroppedMaterial(x, y, z, blockDef.dropType);

                    miningTargetKey = null;
                    miningElapsed = 0;
                    crackOverlayMesh.visible = false;
                    ringBg.classList.add('hidden');
                    ringBar.classList.add('hidden');
                }
            } else {
                miningTargetKey = null;
                miningElapsed = 0;
                crackOverlayMesh.visible = false;
                ringBg.classList.add('hidden');
                ringBar.classList.add('hidden');
            }

            // --- 5. 破壊パーティクル更新 ---
            for (let i = debrisParticles.length - 1; i >= 0; i--) {
                const p = debrisParticles[i];
                p.life -= dt;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    debrisParticles.splice(i, 1);
                    continue;
                }
                p.vel.y -= 16 * dt;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.rotation.x += 5 * dt;
                p.mesh.rotation.y += 6 * dt;
                p.mesh.scale.setScalar(Math.max(0.1, p.life * 1.6));
            }

            // --- 6. ドロップアイテム（素材）の浮遊＆マグネット吸着回収 (仕様 2-③ 準拠) ---
            const playerCenter = new THREE.Vector3(player.pos.x, player.pos.y + 0.85, player.pos.z);

            for (let i = droppedItems.length - 1; i >= 0; i--) {
                const drop = droppedItems[i];
                drop.age += dt;
                if (drop.pickupDelay > 0) drop.pickupDelay -= dt;

                // 回転と上下浮遊アニメーション
                drop.mesh.rotation.y += 2.2 * dt;

                const distToPlayer = drop.mesh.position.distanceTo(playerCenter);

                // プレイヤーとの距離が2.2ブロック以内ならマグネット吸引
                if (drop.pickupDelay <= 0 && distToPlayer < 2.25) {
                    const pullDir = playerCenter.clone().sub(drop.mesh.position).normalize();
                    const pullSpeed = 7.5 + (2.25 - distToPlayer) * 4.5;
                    drop.mesh.position.addScaledVector(pullDir, pullSpeed * dt);

                    // 0.55ブロック以内で回収完了
                    if (distToPlayer < 0.58) {
                        sfx.playPickup();
                        addInventoryItem(drop.typeKey, 1);
                        scene.remove(drop.mesh);
                        droppedItems.splice(i, 1);
                        updateDropsCounter();
                        continue;
                    }
                } else {
                    // 通常の重力落下と地面バウンド・浮遊
                    drop.vel.y -= 15.0 * dt;
                    const nextDropY = drop.mesh.position.y + drop.vel.y * dt;
                    const blockBelow = getBlock(
                        Math.floor(drop.mesh.position.x),
                        Math.floor(nextDropY - 0.16),
                        Math.floor(drop.mesh.position.z)
                    );

                    if (blockBelow && drop.vel.y < 0) {
                        drop.vel.y = 0;
                        drop.vel.x *= 0.8;
                        drop.vel.z *= 0.8;
                        const baseGroundY = blockBelow.y + 1.22;
                        drop.mesh.position.y = baseGroundY + Math.sin(drop.age * 3.5) * 0.07;
                    } else {
                        drop.mesh.position.x += drop.vel.x * dt;
                        drop.mesh.position.y = nextDropY;
                        drop.mesh.position.z += drop.vel.z * dt;
                    }
                }
            }

            // --- 7. HUD座標更新 ---
            document.getElementById('hud-coords').textContent =
                `${Math.floor(player.pos.x)}, ${Math.floor(player.pos.y)}, ${Math.floor(player.pos.z)}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min(0.05, (now - prevTime) / 1000);
            prevTime = now;

            updateGame(dt);
            renderer.render(scene, camera);
        }

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初期化とアニメーション開始
        window.onload = function () {
            buildHotbarUI();
            generateWorld();
            animate();
        };
    </script>
</body>
</html>
